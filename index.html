<head>
  <meta charset="UTF-8">

<body>
<main class="home">
  <div class="home-inner">

    <h1 class="home-title">YOUTH ARCHIVE by Sara Hernández</h1>
    <p class="home-subtitle"></p>

    <img src="img/me-index.jpeg" alt="Sara Hernández" class="home-photo">

    <div class="home-links">
      <a href="/youth.html" class="home-link">YOUTH</a>
      <a href="/archive.html" class="home-link">ARCHIVE</a>

      <a href="/sidenote.html" class="sidenote-link">*sidenote</a>
    </div>

    <details class="notif-panel" id="notif-panel">
      <summary class="notif-header">
        <div class="notif-header-left">
          <span class="notif-panel-title">novedades</span>
          <span class="notif-badge" id="notif-badge">3</span>
        </div>
        <span class="notif-chevron">▾</span>
      </summary>

      <a href="/posts/post-41.html" class="notif-item unread" data-nid="n8" data-date="2026-10-10" onclick="notifRead(this)">
        <span class="notif-dot"></span>
        <div class="notif-body">
          <span class="notif-tipo">post nuevo</span>
          <span class="notif-texto">Headlines</span>
        </div>
        <span class="notif-tiempo">10 oct 2026</span>
      </a>

      <a href="/posts/post-40.html" class="notif-item unread" data-nid="n6" data-date="2026-10-04" onclick="notifRead(this)">
        <span class="notif-dot"></span>
        <div class="notif-body">
          <span class="notif-tipo">post nuevo</span>
          <span class="notif-texto">No me gusta ningún chico</span>
        </div>
        <span class="notif-tiempo">4 oct 2026</span>
      </a>

      <a href="/posts/post-39.html" class="notif-item unread" data-nid="n7" data-date="2026-10-04" onclick="notifRead(this)">
        <span class="notif-dot"></span>
        <div class="notif-body">
          <span class="notif-tipo">post nuevo</span>
          <span class="notif-texto">Octubre</span>
        </div>
        <span class="notif-tiempo">4 oct 2026</span>
      </a>

      

      

      


      

    <script>
      (function() {
        try {
          // Ocultar items con más de 7 días
          var now = new Date();
          document.querySelectorAll('#notif-panel .notif-item[data-date]').forEach(function(el) {
            var d = new Date(el.getAttribute('data-date'));
            if ((now - d) > 7 * 24 * 60 * 60 * 1000) {
              el.hidden = true;
            }
          });

          // Restaurar estado de leídos
          var read = JSON.parse(localStorage.getItem('youth_notif_read') || '[]');
          read.forEach(function(id) {
            var el = document.querySelector('[data-nid="' + id + '"]');
            if (el) el.classList.remove('unread');
          });

          // Actualizar badge
          var unread = document.querySelectorAll('#notif-panel .notif-item:not([hidden]).unread').length;
          var badge = document.getElementById('notif-badge');
          if (badge) {
            if (unread === 0) badge.hidden = true;
            else badge.textContent = unread;
          }
        } catch(e) {}
      })();

      function notifRead(el) {
        el.classList.remove('unread');
        try {
          var read = JSON.parse(localStorage.getItem('youth_notif_read') || '[]');
          var id = el.getAttribute('data-nid');
          if (id && read.indexOf(id) === -1) read.push(id);
          localStorage.setItem('youth_notif_read', JSON.stringify(read));
        } catch(e) {}
        var unread = document.querySelectorAll('#notif-panel .notif-item:not([hidden]).unread').length;
        var badge = document.getElementById('notif-badge');
        if (badge) {
          if (unread === 0) badge.hidden = true;
          else badge.textContent = unread;
        }
      }
    </script>

  </div>
</main>
